[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qaraqalpaqmind"
version = "0.1.0"
description = "Open-source Large Language Model stack for the Karakalpak language"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "QaraqalpaqMind contributors" }]
keywords = ["llm", "karakalpak", "qaraqalpaq", "low-resource", "nlp", "qwen3"]

# Core runtime only. Heavy stacks (torch, vllm, qdrant) live in optional groups
# so that a data-engineering machine never has to install CUDA wheels.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
crawl = [
    "httpx[http2]>=0.28",
    "selectolax>=0.3.25",
    "trafilatura>=2.0",
    "courlan>=1.3",
    "tenacity>=9.0",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
]
ingest = [
    "datasets>=3.2",
    "huggingface-hub>=0.27",
    "mwparserfromhell>=0.6.6",
    "zstandard>=0.23",
    "pyarrow>=18.0",
]
clean = [
    "regex>=2024.11",
    "ftfy>=6.3",
    "datasketch>=1.6",
    "xxhash>=3.5",
    "fasttext-wheel>=0.9.2",
    "sentencepiece>=0.2",
    "zstandard>=0.23",
    "datasets>=3.2",
    "pandas>=2.2",
]
train = [
    "torch>=2.5",
    "transformers>=4.48",
    "trl>=0.13",
    "peft>=0.14",
    "accelerate>=1.2",
    "bitsandbytes>=0.45",
    "deepspeed>=0.16",
    "flash-attn>=2.7; platform_system == 'Linux'",
    "wandb>=0.19",
]
rag = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "FlagEmbedding>=1.3",
    "langchain-text-splitters>=0.3",
]
serve = [
    "vllm>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "prometheus-fastapi-instrumentator>=7.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-PyYAML",
]

[project.scripts]
qm = "qaraqalpaqmind.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qaraqalpaqmind"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC", "ANN", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "ANN401",  # Any is legitimate in generic config/JSON plumbing
    # TYPE_CHECKING-only import blocks trade readability for a startup cost we
    # do not have, and they break `from __future__ import annotations` idioms
    # for anyone reading a module top-down.
    "TC001",
    "TC002",
    "TC003",
    # Karakalpak Latin uses ı ó ń ǵ ú á and the corpus is full of Cyrillic.
    # The "ambiguous unicode character" rules would fire on almost every string
    # literal and every test fixture in this project. Non-negotiable off.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "datasketch.*",
    "fasttext.*",
    "selectolax.*",
    "zstandard.*",
    "datasets.*",
    "mwparserfromhell.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests (network, GPU)",
    "gpu: requires a CUDA device",
]
