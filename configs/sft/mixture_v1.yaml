# How the supervised fine-tuning mixture is assembled.
#
#   qm sft seeds     what hand-authored data exists
#   qm sft build     assemble into data/datasets/sft/
#   qm sft inspect   check how records render as chat
#
# Proportions are NOT proportional to how much data each builder can produce.
# dilmash can supply ~430k translation records and the seed sets supply 45;
# concatenating them would train a translation engine that occasionally
# answers questions. Translation is therefore capped at 30%.

name: sft_v1
# Bounded by instruction-following data, not by total data. At 50000 the
# translation and grammar caps alone were 74% of the built mixture and the
# resulting model answered Karakalpak questions in Azerbaijani.
target_size: 20000
validation_split: 0.02
seed: 20260731

# Always on. FLORES+ sentences reaching the SFT set would invalidate the
# Phase 8 translation benchmark exactly as they would in pretraining.
check_contamination: true

proportions:
  instruction: 0.28      # grounded_qa overviews; the largest share on purpose
  translation: 0.25      # abundant real data, deliberately capped
  grammar: 0.15          # generated from real orthography variation
  summarization: 0.13    # Wikipedia lead sections
  qa: 0.10               # grounded_qa definitions, mined from corpus paragraphs
  conversation: 0.04     # seed-backed; still short, needs hand-authoring
  reasoning: 0.03        # seed-backed; still short, needs hand-authoring
  math: 0.01             # seed-backed; still short, needs hand-authoring
  coding: 0.01           # seed-backed; still short, needs hand-authoring

# Bound how much each builder is asked for, so a build does not take an hour.
max_translation: 40000
max_grammar: 30000
max_summarization: 15000
# Grounded QA and overview instructions mined from corpus paragraphs. This is
# what fills the instruction and qa slots; the seed sets supply 45 records
# between them, and the first SFT run trained on exactly that.
max_grounded_qa: 15000

# Both directions. A model trained only kaa->X translates out of Karakalpak
# and not into it, and into is the direction a Karakalpak assistant needs.
both_translation_directions: true
grammar_explanations: true
