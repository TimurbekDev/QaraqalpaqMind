    legal: permission_needed
    license: unknown
    update_frequency: rarely
    est_size_mb: 25.0
    quality: 5
    scripts: [cyrillic]
    delay_seconds: 4.0
    priority: 2
    enabled: false
    verified_on: 2026-07-31
    notes: >-
      VERIFIED kaa=1.00, Cyrillic. "Qaraqalpaq ádebiyatınıń elektron
      kitapxanası" - full literary works organised by category and author.
      Per megabyte this is the highest-quality Karakalpak prose on the open web.
      TWO BLOCKERS, hence disabled:
      (1) LICENCE - literary works are in copyright unless the author died
          >70 years ago. Contact the operators (linked to shagalalab.com)
          before any bulk fetch, and until then treat this as read-only.
      (2) TRANSPORT - the site serves the library over plain HTTP only; the
          HTTPS vhost on the same name resolves to a different site
          (sozlik.com). Fetch over http:// deliberately or you silently
          collect the wrong corpus.

