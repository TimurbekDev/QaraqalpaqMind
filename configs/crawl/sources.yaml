# Karakalpak (kaa) data source registry.
#
# RULE: nothing is crawled unless it is declared here. Adding a domain means
# opening a diff that states its licence, legal basis and rate limit, so the
# decision is reviewed rather than improvised inside a scraper.
#
# Field meanings: src/qaraqalpaqmind/crawlers/core/registry.py
# Human-readable audit: docs/SOURCES.md
# Live verification:    python scripts/audit_sources.py --include-disabled
#
# `est_size_mb` is *Karakalpak text after extraction*, not download size.
# `quality`: 1 machine noise | 2 raw web | 3 usable | 4 edited | 5 curated prose
# `priority`: 1 fetch first ... 5 last
# `verified_on` means a live probe confirmed the URL serves Karakalpak.

version: 1
contact_email: ${QM_CONTACT_EMAIL:contact@example.com}
user_agent: ${QM_USER_AGENT:QaraqalpaqMindBot/0.1 (+https://github.com/timurbek/QaraqalpaqMind)}

sources:
  # =====================================================================
  # TIER 1 - open licence, bulk download, zero crawl load.
  # =====================================================================

  - id: wiki_kaa
    name: Karakalpak Wikipedia (kaa)
    kind: wiki
    access: dump
    url: https://dumps.wikimedia.org/kaawiki/
    legal: open_license
    license: CC-BY-SA-4.0
    update_frequency: weekly
    est_size_mb: 23.3
    quality: 4
    scripts: [latin]
    priority: 1
    verified_on: 2026-07-31
    notes: >-
      MEASURED 2026-07-31 by `qm ingest run wiki_kaa`: 10,199 documents,
      23.3M chars, ~7.5M estimated tokens, from 15,459 live articles - the
      difference is redirects and sub-200-char stubs, which a small wiki has a
      lot of. The wiki is growing fast (<2k articles in 2023).
      We use the live dump, not the Hugging Face `wikimedia/wikipedia`
      snapshot: that snapshot is pinned to 2023-11-01 with only 4,070 kaa rows.

  - id: hf_karakalpak_corpus_v2
    name: bekan/karakalpak_corpus_v2_m
    kind: dataset
    access: hf
    url: https://huggingface.co/datasets/bekan/karakalpak_corpus_v2_m
    legal: open_license
    license: MIT
    update_frequency: rarely
    est_size_mb: 17.6
    quality: 4
    scripts: [latin]
    priority: 1
    verified_on: 2026-07-31
    notes: >-
      MEASURED: 129,783 documents kept of 135,667 rows, 17.6M chars, ~5.7M
      tokens. Literary + educational + news + public-domain sources.
      Sentence-level only, so document structure is already lost: good for CPT,
      useless for long-context training.

  - id: hf_dilmash_parallel
    name: tahrirchi/dilmash (kaa-uz/ru/en parallel)
    kind: parallel
    access: hf
    url: https://huggingface.co/datasets/tahrirchi/dilmash
    legal: open_license
    license: MIT
    update_frequency: rarely
    est_size_mb: 28.4
    quality: 5
    scripts: [latin]
    priority: 1
    verified_on: 2026-07-31
    notes: >-
      MEASURED: 215,417 Karakalpak-side documents from 300k pairs, 28.4M chars,
      ~9.2M tokens. From OLDI, arXiv:2409.04269. Composition: 34% books, 24%
      dictionaries, 23% news, 19% textbooks, plus 4k Gatitos pairs.
      NOTE the splits are named kaa_eng / kaa_rus / kaa_uzb - there is no
      "train" split. Each record keeps its translation in meta.parallel_text,
      so Phase 6 can rebuild the pairs without re-downloading.

  - id: flores_plus_kaa
    name: FLORES+ dev/devtest (kaa_Latn)
    kind: parallel
    access: hf
    url: https://huggingface.co/datasets/openlanguagedata/flores_plus
    legal: open_license
    license: CC-BY-SA-4.0
    update_frequency: rarely
    est_size_mb: 0.5
    quality: 5
    scripts: [latin]
    priority: 1
    verified_on: 2026-07-31
    notes: >-
      HELD OUT - NEVER TRAIN ON THIS. Human-translated benchmark. Phase 3 dedup
      must blocklist these sentences against every training split, or Phase 8
      translation scores become meaningless.

  - id: madlad400_kaa
    name: MADLAD-400 (kaa split)
    kind: dataset
    access: hf
    url: https://huggingface.co/datasets/allenai/MADLAD-400
    legal: open_license
    license: ODC-BY-1.0
    update_frequency: static
    est_size_mb: 0.0
    quality: 2
    scripts: [latin, cyrillic]
    priority: 5
    enabled: false
    verified_on: 2026-07-31
    notes: >-
      NOT AVAILABLE - CORRECTION. The MADLAD-400 paper covers 419 languages
      including Karakalpak, but the Hugging Face repo does not ship it. The
      `data-v1p5/` tree contains 82 languages and `kaa` is not among them; the
      only files matching "kaa" are membership-inference canaries. Loading it
      fails with "BuilderConfig 'kaa' not found. Available: ['default']".
      This removes ~60 MB from the earlier corpus estimate. Re-check if AllenAI
      publishes the remaining languages.

  - id: glotcc_kaa
    name: GlotCC-V1 (kaa, both scripts)
    kind: dataset
    access: hf
    url: https://huggingface.co/datasets/cis-lmu/GlotCC-V1
    legal: open_license
    license: CC0-1.0
    update_frequency: rarely
    est_size_mb: 1.7
    quality: 2
    scripts: [latin, cyrillic]
    priority: 2
    verified_on: 2026-07-31
    notes: >-
      MEASURED - MUCH SMALLER THAN ESTIMATED. 172 documents total (19 Latin,
      153 Cyrillic), 1.67M chars, ~537k tokens. Row counts confirmed directly
      from the parquet metadata, so this is the true size, not a loader bug.
      The earlier 30 MB figure was wrong by a factor of ~20.
      Loaded via data_files (no per-language builder config):
      v1.0/kaa-Latn/kaa-Latn_0.parquet and v1.0/kaa-Cyrl/kaa-Cyrl_0.parquet.
      Carries per-document WARC provenance, which we keep.
      CAUTION: much of it is scraped kaa.wikipedia, so it overlaps wiki_kaa -
      Phase 3 dedup must run ACROSS sources, not only within them.
      With MADLAD-400 unavailable this is our only Common Crawl source.

  - id: nllb_kaa
    name: NLLB mined bitext (kaa_Latn)
    kind: parallel
    access: hf
    url: https://huggingface.co/datasets/allenai/nllb
    legal: open_license
    license: CC-BY-NC-4.0
    update_frequency: static
    est_size_mb: 25.0
    quality: 2
    scripts: [latin]
    priority: 4
    enabled: false
    verified_on: 2026-07-31
    notes: >-
      DISABLED - LICENCE. CC-BY-NC forbids commercial use; mixing it into the
      pretraining corpus would contaminate the licence of the released weights.
      Machine-mined pairs, so quality is mediocre anyway. Enable only if the
      project accepts a non-commercial release.

  # =====================================================================
  # TIER 2 - VERIFIED live Karakalpak web. Probed 2026-07-31; every entry
  # below returned Karakalpak text with a detector score >= 0.88.
  # =====================================================================

  - id: news_kknews
    name: Qaraqalpaqstan Xabar Agentligi (QXA)
    kind: news
    access: crawl
    url: https://kknews.uz/qq/
    legal: government_work
    license: unknown
    update_frequency: daily
    est_size_mb: 3.1
    quality: 4
    scripts: [latin]
    allowed_paths: ["/qq/"]
    denied_paths: ["/ru/", "/uz/", "/en/", "/search", "/tag/", "/wp-admin/"]
    delay_seconds: 2.0
    use_sitemap: false
    priority: 1
    verified_on: 2026-07-31
    notes: >-
      VERIFIED by a real crawl: 30 pages fetched, 0 failures, 100% Karakalpak,
      262 further URLs discovered. State news agency of Karakalpakstan and the
      best live Karakalpak news feed.

      SITEMAP DISABLED, and the reason matters. The WordPress sitemap indexes
      only the RUSSIAN edition: its 1,785 entries are bare-ID permalinks such
      as /225694.html which serve Russian, and /ru/225694.html redirects to
      them. Karakalpak lives under /qq/ and is absent from the sitemap
      entirely. `allowed_paths: ["/qq/"]` correctly rejected all 1,785 of them;
      without it this source would have poured a Russian corpus into a
      Karakalpak dataset. Seeding is therefore link-crawl from /qq/.
      Two sitemap children also return HTTP 500 intermittently.

      ROBOTS/AI POLICY - READ BEFORE SCALING UP. robots.txt sets
      `User-agent: *` to `Allow: /`, so our crawler is permitted. But it also
      names and blocks AI crawlers specifically: ClaudeBot, GPTBot,
      OAI-SearchBot, plus SemrushBot, AhrefsBot, MJ12bot and DotBot. The
      operators have evidently thought about AI training crawlers and opted
      out of the ones they know by name. We are inside the letter of the rules
      and arguably outside their spirit. Seek written permission before any
      full-site crawl, and never rename the User-Agent to evade a rule.

