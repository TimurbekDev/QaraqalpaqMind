# Top-level nginx configuration for the QaraqalpaqMind stack.
# Per-site rules live in conf.d/.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time and $request_time separate "the model was slow"
    # from "we were slow", which is the first question during an incident.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    # Off, not on. tcp_nodelay disables Nagle's algorithm, which otherwise holds
    # small writes back waiting for more data - and every SSE token is a small
    # write. With Nagle on, streaming arrives in bursts.
    tcp_nodelay     on;

    keepalive_timeout  75s;
    server_tokens   off;

    # A generation can legitimately produce several hundred KB. The limit that
    # matters for abuse is on the request, set per-location below.
    client_max_body_size 2m;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Rate limiting at the edge, in front of the gateway's own per-key limits.
    # These two catch different things: nginx sees IPs and stops a flood before
    # it reaches Python, the gateway sees API keys and enforces fair use. Neither
    # replaces the other.
    limit_req_zone  $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
