# Reverse proxy for the QaraqalpaqMind API.
#
# TLS is commented out rather than absent: a config that references certificate
# files which do not exist makes nginx refuse to start, so the stack would not
# run at all until certificates were issued. Uncomment the second server block
# once ../certs holds a real certificate.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS server. This is here for a specific failure:
    # nginx resolves an upstream hostname ONCE at startup and caches the
    # address for the life of the process. The api container has
    # `restart: unless-stopped`, and a restarted container can come back on a
    # different IP - at which point nginx serves 502 for every request until
    # nginx itself is restarted, with the api container sitting there healthy.
    #
    # A hostname held in a variable is re-resolved instead, honouring `valid=`.
    # The cost is upstream keepalive, which an `upstream` block would give and
    # this does not. That trade is worth taking here: generation requests last
    # seconds to minutes, so one extra TCP handshake per request on a local
    # bridge network is not measurable, and silent 502s are.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qm_api "api:8000";

    # Nothing here is a browser-visible asset, so a wrong MIME sniff can only
    # do harm.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Liveness must stay reachable and unlogged: an orchestrator polling every
    # few seconds otherwise fills the access log with noise that hides real
    # traffic.
    location = /healthz {
        access_log off;
        proxy_pass http://$qm_api;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://$qm_api;
    }

    # Prometheus scrapes from inside the network. Exposing it publicly leaks
    # request volumes and model identity, so it is refused at the edge and
    # reached over the compose network instead.
    location = /metrics {
        deny all;
        return 403;
    }

    location /v1/ {
        limit_req  zone=api burst=20 nodelay;
        limit_conn conn 10;

        proxy_pass http://$qm_api;

        # nginx talks HTTP/1.0 upstream by default, which has no chunked
        # transfer encoding - so a response of unknown length cannot be streamed
        # and nginx buffers it whole. Required for SSE, not an optimisation.
        proxy_http_version 1.1;
        # Drop the inbound Connection header rather than forwarding it: a client
        # sending `Connection: close` would otherwise close the upstream link.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-sent events -------------------------------------------
        #
        # This block is the whole reason streaming works. With nginx defaults,
        # `"stream": true` still produces a correct response - delivered as one
        # lump when generation finishes, which looks exactly like streaming
        # being broken in the frontend.
        #
        # proxy_buffering off  : forward each chunk instead of filling a buffer.
        # proxy_cache off      : never store a token stream.
        # chunked_transfer_encoding on : no Content-Length is known in advance.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Generation legitimately takes minutes, and a long first token is
        # normal on a cold model. The default 60s read timeout would cut the
        # connection mid-answer and surface as a truncated reply.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Everything else - /docs, /openapi.json - without the streaming settings.
    location / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://$qm_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- TLS -------------------------------------------------------------------
